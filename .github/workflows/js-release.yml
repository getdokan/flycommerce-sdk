name: js-release

# Changesets: pending changesets on main open or update the "Version Packages" PR.
# Merging that PR leaves none pending, and the publish job releases what changed.
on:
  push:
    branches: [main]
    paths: ['js/**']
  workflow_dispatch:

permissions: {}

concurrency:
  group: js-release
  cancel-in-progress: false

jobs:
  mode:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: js/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: js
      - id: mode
        uses: changesets/action/select-mode@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          cwd: js

  version:
    needs: mode
    if: needs.mode.outputs.mode == 'version'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: js/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: js
      - uses: changesets/action/version@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          cwd: js
          pr-title: 'chore(release): version packages'
          commit-message: 'chore(release): version packages'

  publish:
    needs: mode
    # Off until an admin sets the repo variable NPM_PUBLISH_ENABLED=true, after the first manual publish and Trusted Publisher setup.
    if: needs.mode.outputs.mode == 'publish' && vars.NPM_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Required reviewers on this environment approve every release.
    environment: release
    permissions:
      contents: write # tags and GitHub releases
      id-token: write # npm Trusted Publishing and provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: js/package-lock.json
      # Trusted Publishing needs npm 11.5.1 or newer.
      - run: npm install -g npm@^11.5.1
      - run: npm ci --ignore-scripts
        working-directory: js
      - run: npm test
        working-directory: js
      - uses: changesets/action/publish@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          cwd: js
          script: npm run release
          create-github-releases: true
        env:
          NPM_CONFIG_PROVENANCE: 'true'
