name: ai

on:
  pull_request:
    paths: ['.claude-plugin/**', 'ai/**', '.github/workflows/ai.yml']
  push:
    branches: [main]
    paths: ['.claude-plugin/**', 'ai/**', '.github/workflows/ai.yml']

permissions:
  contents: read

concurrency:
  group: ai-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # Whatever is on main is what developers install, so warnings fail too.
      - name: Validate the marketplace and every plugin
        run: |
          npx -y @anthropic-ai/claude-code@2.1.289 plugin validate --strict .
          for plugin in ai/claude/*/; do
            npx -y @anthropic-ai/claude-code@2.1.289 plugin validate --strict "$plugin"
          done
