name: pr-title

# The squash commit on main takes the PR title, so the title is what has to follow Conventional Commits.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions: {}

jobs:
  check:
    name: conventional title
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Title follows Conventional Commits
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          if ! printf '%s' "$TITLE" | grep -Eq '^(feat|fix|perf|refactor|docs|test|build|ci|chore|revert)(\([a-z0-9.-]+\))?!?: [^ ]'; then
            echo "::error title=PR title::The title must follow Conventional Commits, for example 'fix(data-table): keep the toolbar on one row'. See CONTRIBUTING.md."
            exit 1
          fi
